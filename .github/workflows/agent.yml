# Runs the rental agent twice a day (08:00 and 20:00 Israel time) and publishes the dashboard.
# Design: Architecture.md §4.1. GitHub cron is UTC-only, so it fires at both possible UTC hours
# and `rental_agent due` decides which trigger is the real Israel-time slot.
name: rental-agent

on:
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: rental-agent
  cancel-in-progress: false

permissions:
  contents: write    # push rentals.db + reports to the data branch
  pages: write
  id-token: write

env:
  RENTAL_AGENT_CONFIG: deploy/github-actions.toml

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ran: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore memory (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Is a slot due? (guard)
        id: due
        run: python -m rental_agent due --manual "${{ github.event_name == 'workflow_dispatch' }}"

      - name: Run the agent
        id: agent
        if: steps.due.outputs.run == 'true'
        continue-on-error: true   # still save memory and publish the dashboard when a run fails
        run: python -m rental_agent run-once --slot "${{ steps.due.outputs.slot }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save memory and reports
        if: steps.due.outputs.run == 'true'
        working-directory: data
        run: |
          git config user.name "rental-agent"
          git config user.email "rental-agent@users.noreply.github.com"
          git add rentals.db reports
          git diff --cached --quiet || git commit -m "run $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
          git push origin HEAD:data

      - name: Build dashboard
        if: steps.due.outputs.run == 'true'
        run: python -m rental_agent export-dashboard --out site

      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.run == 'true'
        with:
          path: site

      - name: Fail the job if the agent run failed (GitHub then emails the repo owner)
        if: steps.agent.outcome == 'failure'
        run: exit 1

  deploy:
    needs: run
    if: always() && needs.run.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
